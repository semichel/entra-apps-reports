name: Entra application report
run-name: Entra application report - ${{ github.ref_name }}
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  POWERSHELL_TELEMETRY_OPTOUT: 1
  AZURE_POWERSHELL_TELEMETRY_OPTOUT: 1
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Validate production configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Validate-ProductionConfig.ps1
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Select the main branch.' }
          $env:GH_HOST = ([uri]$env:GITHUB_SERVER_URL).Host
          $visibility = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.visibility'
          if ($LASTEXITCODE -ne 0 -or $visibility -notin @('private', 'internal')) { throw 'Use a private or internal company repository for production reports.' }
      - name: Install modules
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Install-Module Az -Scope CurrentUser -Repository PSGallery -Force
          Install-Module Microsoft.Graph.Authentication -Scope CurrentUser -Repository PSGallery -Force
      - name: Federated reader login
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true
      - name: Generate report
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Microsoft.Graph.Authentication
          $token = (Get-AzAccessToken -ResourceTypeName MSGraph -AsSecureString).Token
          Connect-MgGraph -AccessToken $token -NoWelcome
          try {
              ./scripts/Export-EntraAppsReport.ps1 -ConfigPath ./config/production.json
          } finally {
              Disconnect-MgGraph | Out-Null
          }
      - name: Upload report and evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: entra-apps-report-${{ github.run_number }}
          path: reports/latest/
          if-no-files-found: error
      - name: Publish report on the Actions Summary page
        shell: pwsh
        env:
          REPORT_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          python scripts/write_action_summary.py --report reports/latest/report.json --artifact-url $env:REPORT_ARTIFACT_URL --output $env:GITHUB_STEP_SUMMARY
