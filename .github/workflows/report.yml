name: Entra application report
run-name: Entra application report - ${{ github.ref_name }}
on:
  workflow_dispatch:
concurrency:
  group: entra-report-pages
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
env:
  POWERSHELL_TELEMETRY_OPTOUT: 1
  AZURE_POWERSHELL_TELEMETRY_OPTOUT: 1
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Validate production configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID')) {
              $value = [Environment]::GetEnvironmentVariable($name)
              $parsed = [guid]::Empty
              if (-not [guid]::TryParse($value, [ref]$parsed) -or $parsed -eq [guid]::Empty) {
                  throw "$name is missing or invalid. Set it as a repository Actions secret or variable under Settings > Secrets and variables > Actions. Organization secrets must allow this repository. Environment secrets require the job to use that environment."
              }
          }
          ./scripts/Validate-ProductionConfig.ps1
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Select the main branch.' }
          $env:GH_HOST = ([uri]$env:GITHUB_SERVER_URL).Host
          $visibility = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.visibility'
          if ($LASTEXITCODE -ne 0 -or $visibility -notin @('public', 'private', 'internal')) { throw 'Could not verify repository visibility.' }
      - name: Install modules
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Install-Module Az -Scope CurrentUser -Repository PSGallery -Force
          Install-Module Microsoft.Graph.Authentication -Scope CurrentUser -Repository PSGallery -Force
      - name: Federated reader login
        uses: azure/login@v2
        with:
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          client-id: ${{ env.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true
      - name: Generate report
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Microsoft.Graph.Authentication
          $token = (Get-AzAccessToken -ResourceTypeName MSGraph -AsSecureString).Token
          Connect-MgGraph -AccessToken $token -NoWelcome
          try {
              ./scripts/Export-EntraAppsReport.ps1 -ConfigPath ./config/production.json
          } finally {
              Disconnect-MgGraph | Out-Null
          }
      - name: Upload report and evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: entra-apps-report-${{ github.run_number }}
          path: reports/latest/
          if-no-files-found: error
      - name: Link report evidence artifact
        env:
          REPORT_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "[Download report and JSON/CSV evidence]($env:REPORT_ARTIFACT_URL)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Prepare HTML website
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path site -Force | Out-Null
          Copy-Item -LiteralPath reports/latest/report.html -Destination site/index.html
          New-Item -ItemType File -Path site/.nojekyll -Force | Out-Null
      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
  deploy:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate Pages access
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GH_HOST = ([uri]$env:GITHUB_SERVER_URL).Host
          $site = gh api "repos/$env:GITHUB_REPOSITORY/pages"
          if ($LASTEXITCODE -ne 0) { throw 'Configure Settings > Pages with GitHub Actions publishing before deploying. The report artifact remains available.' }
          $pages = $site | ConvertFrom-Json -AsHashtable
          if ($pages['public'] -isnot [bool]) { throw 'Could not verify Pages visibility. Deployment stopped.' }
          $visibility = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.visibility'
          if ($LASTEXITCODE -ne 0 -or $visibility -notin @('public', 'private', 'internal')) { throw 'Could not verify repository visibility. Deployment stopped.' }
          if ($pages['public'] -and $visibility -ne 'public') { throw 'Private/internal repositories require private Pages access. Public Pages is allowed only for a public repository intended for public reports.' }
      - name: Deploy interactive report
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Link report website
        shell: pwsh
        env:
          REPORT_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          "## Entra application report`n`n[Open the interactive report]($env:REPORT_PAGE_URL)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
