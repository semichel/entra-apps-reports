name: Entra application report
run-name: Entra applications — ${{ inputs.mode }} report
on:
  workflow_dispatch:
    inputs:
      mode:
        description: snapshot = lab inventory; lab/prod = fresh configured tenant; demo = synthetic
        type: choice
        options: [snapshot, lab, demo, prod]
        default: snapshot
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'prod' && 'production' || 'lab' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts
        shell: pwsh
        run: |
          ./tests/Test-Report.ps1
          python -m unittest discover -s tests -p test_render_report.py
          if ($LASTEXITCODE -ne 0) { throw 'Lifecycle report checks failed.' }
      - name: Validate reader settings
        id: settings
        if: inputs.mode == 'lab' || inputs.mode == 'prod'
        shell: pwsh
        env:
          LAB_TENANT_ID: ${{ vars.LAB_TENANT_ID }}
          LAB_CLIENT_ID: ${{ vars.LAB_CLIENT_ID }}
          REPORT_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:REPORT_MODE -eq 'prod') {
              . ./scripts/Report.Common.ps1
              . ./scripts/Report.Deployment.ps1
              $config = Read-ReportDeployment ./config/production.json
              if ($env:GITHUB_REPOSITORY -ne (Get-Str $config 'githubRepository')) { throw 'Production repository does not match config.' }
              if ($env:GITHUB_REF -ne ('refs/heads/' + (Get-Str $config 'githubBranch'))) { throw 'Production must run from its configured trusted branch.' }
              $private = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private'
              if ($LASTEXITCODE -ne 0 -or $private -ne 'true') { throw 'Production reports require a private repository.' }
              $readerTenant = Get-Str $config 'tenantId'
              $readerClient = Get-Str $config 'clientId'
              $retention = Get-Val $config 'artifactRetentionDays'
          } else {
              if ($env:LAB_TENANT_ID -ne '37dadda4-f2a4-47a8-8482-d40fe1a5aa48') { throw 'Expected MichelAB lab tenant ID.' }
              $clientGuid = [guid]::Empty
              if (-not [guid]::TryParse($env:LAB_CLIENT_ID, [ref]$clientGuid) -or $clientGuid -eq [guid]::Empty) { throw 'Set LAB_CLIENT_ID in the lab environment.' }
              $readerTenant = $env:LAB_TENANT_ID
              $readerClient = $env:LAB_CLIENT_ID
              $retention = 14
          }
          Add-Content $env:GITHUB_OUTPUT "tenant_id=$readerTenant"
          Add-Content $env:GITHUB_OUTPUT "client_id=$readerClient"
          Add-Content $env:GITHUB_OUTPUT "retention_days=$retention"
      - name: Federated reader login
        if: inputs.mode == 'lab' || inputs.mode == 'prod'
        uses: azure/login@v3
        with:
          tenant-id: ${{ steps.settings.outputs.tenant_id }}
          client-id: ${{ steps.settings.outputs.client_id }}
          allow-no-subscriptions: true
      - name: Generate report
        shell: pwsh
        env:
          REPORT_MODE: ${{ inputs.mode }}
          READER_TENANT_ID: ${{ steps.settings.outputs.tenant_id }}
          READER_CLIENT_ID: ${{ steps.settings.outputs.client_id }}
        run: |
          if ($env:REPORT_MODE -eq 'snapshot') {
              ./scripts/Export-EntraAppsReport.ps1 -SnapshotPath ./published/lab/report.json
          } elseif ($env:REPORT_MODE -eq 'demo') {
              ./scripts/Export-EntraAppsReport.ps1 -Demo
          } else {
              Install-Module Microsoft.Graph.Authentication -Scope CurrentUser -Repository PSGallery -Force
              Import-Module Microsoft.Graph.Authentication
              $tokenText = az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv
              if ($LASTEXITCODE -ne 0 -or -not $tokenText) { throw 'Graph access token acquisition failed.' }
              Write-Output "::add-mask::$tokenText"
              $secureToken = ConvertTo-SecureString $tokenText -AsPlainText -Force
              Connect-MgGraph -AccessToken $secureToken -NoWelcome
              try {
                  $context = Get-MgContext
                  if ($context.ClientId -ne $env:READER_CLIENT_ID -or $context.TenantId -ne $env:READER_TENANT_ID) { throw 'Unexpected Graph reader identity.' }
                  if ($env:REPORT_MODE -eq 'prod') {
                      ./scripts/Export-EntraAppsReport.ps1 -ConfigPath ./config/production.json -UseExistingContext
                  } else {
                      ./scripts/Export-EntraAppsReport.ps1 -TenantId $env:READER_TENANT_ID -UseExistingContext -IncludeExtendedEvidence
                  }
              } finally {
                  Disconnect-MgGraph | Out-Null
              }
          }
      - name: Upload interactive HTML report and evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: entra-apps-report-${{ inputs.mode }}-${{ github.run_number }}
          path: reports/latest/
          retention-days: ${{ steps.settings.outputs.retention_days || '14' }}
          if-no-files-found: error
      - name: Show readable report on the Actions page
        shell: pwsh
        env:
          REPORT_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          python scripts/write_action_summary.py --report reports/latest/report.json --artifact-url $env:REPORT_ARTIFACT_URL --output $env:GITHUB_STEP_SUMMARY
