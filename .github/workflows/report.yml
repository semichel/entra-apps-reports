name: Entra application report
run-name: Entra production application report
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate production configuration
        id: settings
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/Report.Common.ps1
          . ./scripts/Report.Deployment.ps1
          $config = Read-ReportDeployment ./config/production.json
          if ($env:GITHUB_REPOSITORY -ne (Get-Str $config 'githubRepository')) { throw 'Repository does not match production config.' }
          if ($env:GITHUB_REF -ne ('refs/heads/' + (Get-Str $config 'githubBranch'))) { throw 'Select the configured trusted branch.' }
          $private = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $private -ne 'true') { throw 'Production reports require a private repository.' }
          Add-Content $env:GITHUB_OUTPUT ("tenant_id=" + (Get-Str $config 'tenantId'))
          Add-Content $env:GITHUB_OUTPUT ("client_id=" + (Get-Str $config 'clientId'))
          Add-Content $env:GITHUB_OUTPUT ("retention_days=" + (Get-Val $config 'artifactRetentionDays'))
      - name: Federated reader login
        uses: azure/login@v3
        with:
          tenant-id: ${{ steps.settings.outputs.tenant_id }}
          client-id: ${{ steps.settings.outputs.client_id }}
          allow-no-subscriptions: true
      - name: Generate report
        shell: pwsh
        run: |
          Install-Module Microsoft.Graph.Authentication -Scope CurrentUser -Repository PSGallery -Force
          Import-Module Microsoft.Graph.Authentication
          $tokenText = az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0 -or -not $tokenText) { throw 'Graph access token acquisition failed.' }
          Write-Output "::add-mask::$tokenText"
          Connect-MgGraph -AccessToken (ConvertTo-SecureString $tokenText -AsPlainText -Force) -NoWelcome
          try {
              ./scripts/Export-EntraAppsReport.ps1 -ConfigPath ./config/production.json
          } finally {
              Disconnect-MgGraph | Out-Null
          }
      - name: Upload report and evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: entra-apps-report-${{ github.run_number }}
          path: reports/latest/
          retention-days: ${{ steps.settings.outputs.retention_days }}
          if-no-files-found: error
      - name: Publish report on the Actions Summary page
        shell: pwsh
        env:
          REPORT_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          python scripts/write_action_summary.py --report reports/latest/report.json --artifact-url $env:REPORT_ARTIFACT_URL --output $env:GITHUB_STEP_SUMMARY
